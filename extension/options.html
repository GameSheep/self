<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>设置 · Self-Hub</title>
    <link rel="icon" type="image/png" href="icon48.png" />
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #090a0c;
        color: #f4f4f5;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      }
      main {
        max-width: 560px;
        padding: 32px 28px;
        border: 1px solid #22242a;
        border-radius: 16px;
        background: #121316;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 8px;
      }
      p {
        font-size: 12px;
        line-height: 1.7;
        color: #a1a1aa;
        margin: 0 0 12px;
      }
      button {
        margin-top: 8px;
        padding: 8px 14px;
        border-radius: 10px;
        border: 1px solid #3f3f46;
        background: #f4f4f5;
        color: #18181b;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      #legacy-note {
        margin-top: 14px;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid rgba(251, 191, 36, 0.5);
        background: rgba(251, 191, 36, 0.1);
        color: #fbbf24;
        font-size: 11px;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>设置已移动到工作台</h1>
      <p>
        连接、备份、浏览器与设备、隐私与安全现在都在同一个设置页里维护，凭据只保存一份。
        本页面不再提供服务商密钥表单，也不会在此启用任何同步任务。
      </p>
      <button id="open-settings" type="button">打开统一设置</button>
      <p id="legacy-note" hidden></p>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
