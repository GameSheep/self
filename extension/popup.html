<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Self-Hub 浏览器助手</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 280px;
      background: #090a0c;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 14px;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 10px;
      border-bottom: 1px solid #1f2127;
      margin-bottom: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 14px;
    }
    .brand-logo {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: #18191e;
      border: 1px solid #27272a;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #10b981;
      font-family: monospace;
      font-size: 13px;
    }
    .status-badge {
      font-size: 10px;
      color: #10b981;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 2px 6px;
      border-radius: 4px;
    }
    .info-box {
      background: #121316;
      border: 1px solid #22242a;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 12px;
      font-size: 11px;
      color: #a1a1aa;
      line-height: 1.5;
    }
    .page-title {
      font-weight: 600;
      color: #e4e4e7;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .btn {
      width: 100%;
      background: #18191e;
      border: 1px solid #27272a;
      color: #f4f4f5;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.15s;
    }
    .btn:hover {
      background: #27272a;
      border-color: #3f3f46;
    }
    .btn-primary {
      background: #10b981;
      color: #000;
      border: none;
      font-weight: 600;
    }
    .btn-primary:hover {
      background: #059669;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <img src="icon48.png" alt="Self-Hub" style="width: 24px; height: 24px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1);" />
      <span>Self-Hub</span>
    </div>
    <span class="status-badge">在线运行</span>
  </div>

  <div class="info-box">
    <div class="page-title" id="page-title">正在检测当前页面...</div>
    <div id="page-highlights-count">本页划线: 0 条</div>
  </div>

  <div class="actions">
    <button id="open-panel-btn" class="btn">
      <span>展开批注侧边栏</span>
      <span>&rarr;</span>
    </button>
    <button id="save-inbox-btn" class="btn">
      <span>📥 存入统一收件箱</span>
      <span>+</span>
    </button>
    <button id="open-sync-btn" class="btn">
      <span>☁️ S3 / WebDAV 云同步设置</span>
      <span>&rarr;</span>
    </button>
    <button id="open-app-btn" class="btn btn-primary">
      <span>进入 Self-Hub 主工作台</span>
      <span>&rarr;</span>
    </button>
  </div>

  <script src="client.js"></script>
  <script src="popup.js"></script>
</body>
</html>
