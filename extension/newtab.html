<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Self-Hub</title>
  <link rel="icon" type="image/png" href="icon48.png" />
  <link rel="stylesheet" href="newtab.css" />
</head>
<body>
  <div class="wrap">
    <!-- 独立页：没有左侧菜单。右上角才进工作台。 -->
    <header class="top">
      <div class="brand">
        <span class="brand-mark">H</span>
        <span>
          Self-Hub
          <span class="brand-sub" id="save-state"></span>
        </span>
      </div>
      <div class="top-actions">
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换深浅色">☀️</button>
        <a class="btn-primary" id="open-workspace" href="app/index.html#/home">进入工作台 →</a>
      </div>
    </header>

    <main class="grid">
      <!-- 左：笔记 -->
      <section class="card" aria-label="笔记">
        <div class="card-head">
          <span class="card-title">📝 笔记</span>
          <a class="card-link" id="open-notes" href="app/index.html#/library?view=notes">全部 →</a>
        </div>
        <div class="card-body tight">
          <div class="list" id="notes-list"></div>
        </div>
      </section>

      <!-- 中：搜索 → 常用网站 → 全部网站按分类 -->
      <section>
        <div class="search-box">
          <span class="subtle">🔍</span>
          <input
            id="search-input"
            type="search"
            autocomplete="off"
            placeholder="搜索所有内容：笔记、批注、网站、服务器、域名、凭证、项目、提醒…"
            aria-label="搜索所有内容"
          />
        </div>
        <div class="results" id="results" hidden></div>

        <div class="capture">
          <input id="capture-input" type="text" placeholder="记一笔：先进收件箱，回工作台再整理" aria-label="快速记录" />
          <button id="capture-submit" type="button">记录</button>
        </div>
        <div class="capture-status" id="capture-status"></div>

        <!-- 签到：一条横排的站点清单，点一个直接打开签到页。 -->
        <div class="checkin-strip" id="checkins-strip" hidden>
          <span class="strip-label">✅ 今日签到</span>
          <div class="strip-items" id="checkins-items"></div>
          <a class="strip-link" id="open-checkins" href="app/index.html#/tools/checkins">管理 →</a>
        </div>

        <div class="card" style="margin-top: 10px">
          <div class="card-head">
            <span class="card-title">⭐ 常用网站</span>
            <span class="card-link" id="pin-hint">点 ☆ 把网站放进常用</span>
          </div>
          <div class="card-body">
            <div class="sites" id="pinned-sites"></div>
          </div>
        </div>

        <div class="card">
          <div class="card-head">
            <span class="card-title">🌐 全部网站</span>
            <a class="card-link" id="open-navigation" href="app/index.html#/navigation">管理 →</a>
          </div>
          <div class="card-body" id="all-sites"></div>
        </div>
      </section>

      <!-- 右：提醒 + 网页批注 -->
      <section>
        <div class="card" aria-label="提醒">
          <div class="card-head">
            <span class="card-title">🔔 提醒</span>
            <a class="card-link" id="open-reminders" href="app/index.html#/reminders">全部 →</a>
          </div>
          <div class="card-body tight">
            <div class="list" id="reminders-list"></div>
          </div>
        </div>

        <div class="card" aria-label="网页批注" style="margin-top: 10px">
          <div class="card-head">
            <span class="card-title">🖍️ 网页批注</span>
            <a class="card-link" id="open-annotations" href="app/index.html#/library?type=webpage">全部 →</a>
          </div>
          <div class="card-body tight">
            <div class="list" id="annotations-list"></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="client.js"></script>
  <script src="newtab.js"></script>
</body>
</html>
