<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Self-Hub</title>
  <link rel="icon" type="image/png" href="icon48.png" />
  <link rel="stylesheet" href="newtab.css" />
</head>
<body>
  <div class="wrap">
    <!-- 独立页：没有左侧菜单。右上角才进工作台。 -->
    <header class="top">
      <div class="brand">
        <span class="brand-mark">H</span>
        <span>
          Self-Hub
          <span class="brand-sub" id="save-state"></span>
        </span>
      </div>
      <div class="top-actions">
        <div class="col-count-control" id="col-count-control" title="调整面板列数（1 ~ 6 栏，保留基础左中右）">
          <button class="ghost-btn col-count-btn" id="col-dec" type="button" aria-label="减少一栏">－ 栏</button>
          <span class="col-count-label" id="col-count-label">3 栏</span>
          <button class="ghost-btn col-count-btn" id="col-inc" type="button" aria-label="增加一栏">＋ 栏</button>
        </div>
        <button class="ghost-btn" id="reset-layout" type="button" title="把模块布局恢复成默认三栏">重置布局</button>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换深浅色">☀️</button>
        <a class="btn-primary" id="open-workspace" href="app/index.html#/home">进入工作台 →</a>
      </div>
    </header>

    <!-- 搜索固定在最上面：它是这一页的主操作，不参与模块自定义。 -->
    <div class="search-row">
      <div class="search-box">
        <span class="subtle">🔍</span>
        <input
          id="search-input"
          type="search"
          autocomplete="off"
          placeholder="搜索所有内容：笔记、批注、网站、服务器、域名、凭证、项目、提醒…"
          aria-label="搜索所有内容"
        />
      </div>
      <div class="results" id="results" hidden></div>
    </div>

    <!-- 模块面板：每个卡片都能拖拽调大小、换数据来源、增删。 -->
    <div class="dash-hint" id="dash-hint" hidden>
      <span>按住卡片任意处拖动换位置 · 拖底边改高度 · 拖右边缘/右下角改宽度（半栏并排/全宽）· 顶栏增减栏数 · 拖两栏细线调列宽 · 点 ⋯ 换数据来源</span>
      <button type="button" id="dash-hint-close">知道了</button>
    </div>
    <main class="dash" id="dash" aria-label="模块面板"></main>
  </div>

  <script src="client.js"></script>
  <script src="newtab-dashboard.js"></script>
  <script src="newtab.js"></script>
</body>
</html>
